spring.application.name=tenantguard-lab
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/tenantguard_db}
spring.datasource.username=${DB_USER:tenantguard_user}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
jwt.private-key=file:./keys/private.pem
jwt.public-key=file:./keys/public.pem